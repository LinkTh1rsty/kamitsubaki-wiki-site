name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Verify patched Node.js runtime
        run: node scripts/check-node-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared UI tokens
        run: pnpm ui:tokens:check

      - name: Check shared UI icons
        run: pnpm check:ui-icons

      - name: Run tests
        run: pnpm test

      - name: Run Astro check
        run: pnpm check

      - name: Check documentation links
        run: pnpm docs:check

      - name: Audit synchronized lyrics
        run: pnpm lyrics:timestamps:audit -- --strict

      - name: Build static site
        env:
          PUBLIC_EDITOR_ENABLED: 'true'
          PUBLIC_EDITOR_API_BASE: https://api.kamitsubaki.wiki
        run: pnpm build

      - name: Check generated internal links
        run: node scripts/v3/check-built-links.mjs

      - name: Audit Cloudflare Pages asset sizes
        run: pnpm pages:assets:audit
